
<!-- 12. Customer Login
Write JavaScript to implement a simple customer login form with email and password validation. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
</head>
<body>
    <h1>Customer Login</h1>
    <form id="loginForm">
        <label>
            Email:
            <input id="email" type="email" required>
        </label>
        <br>
        <label>
            Password:
            <input id="password" type="password" required>
        </label>
        <br>
        <button type="submit">Log in</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById("loginForm").addEventListener("submit", (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const customers = JSON.parse(localStorage.getItem("customerRegistrations") || "[]");
            const customer = customers.find(
                (savedCustomer) => savedCustomer.email.toLowerCase() === email &&
                    savedCustomer.password === password
            );

            if (customer) {
                document.getElementById("message").textContent = "Login successful.";
            } else {
                alert("Invalid email or password.");
                document.getElementById("message").textContent = "Login failed.";
            }
        });
    </script>
</body>
</html>
