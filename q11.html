<!-- 11. Store Registration Data
Store validated customer registration details in localStorage. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Customer Registration</title>
</head>
<body>
    <h1>Customer Registration</h1>
    <form id="registrationForm" novalidate>
        <label>
            Customer name:
            <input id="customerName" type="text" required>
        </label>
        <br>
        <label>
            Email:
            <input id="email" type="email" required>
        </label>
        <br>
        <label>
            Password:
            <input id="password" type="password" required>
        </label>
        <br>
        <button type="submit">Register</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const customer = {
                name: document.getElementById("customerName").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };
            const message = document.getElementById("message");

            if (!/^[A-Za-z ]+$/.test(customer.name)) {
                message.textContent = "Enter a name using letters and spaces only.";
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(customer.email)) {
                message.textContent = "Enter a valid email address.";
                return;
            }

            if (customer.password.length < 8) {
                message.textContent = "Password must contain at least 8 characters.";
                return;
            }

            const customers = JSON.parse(localStorage.getItem("customerRegistrations") || "[]");
            const alreadyRegistered = customers.some(
                (savedCustomer) => savedCustomer.email.toLowerCase() === customer.email.toLowerCase()
            );

            if (alreadyRegistered) {
                message.textContent = "This email is already registered.";
                return;
            }

            customers.push(customer);
            localStorage.setItem("customerRegistrations", JSON.stringify(customers));
            message.textContent = "Registration details saved.";
            event.target.reset();
        });
    </script>
</body>
</html>
