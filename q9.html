<!-- 9. Event Listener
Implement an event listener that displays the total number of products in the shopping cart
when a button is clicked. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart Product Count</title>
</head>
<body>
    <h1>Shopping Cart</h1>
    <ul id="cartList">
        <li data-quantity="2">Tyres (quantity: 1)</li>
        <li data-quantity="3">Break Pads (quantity: 0)</li>
        <li data-quantity="1">Windshield Wipers (quantity: 2)</li>
        <li data-quantity="8">Engine Oil (quantity: 8)</li>
        <li data-quantity="3">Car Seats (quantity: 4)</li>
        <li data-quantity="8">Tire Chains (quantity: 2)</li>
        <li data-quantity="1">Chain Oil (quantity: 7)</li>
    </ul>

    <button id="countProducts">Show total products</button>
    <p id="productCount"></p>

    <script>
        document.getElementById("countProducts").addEventListener("click", () => {
            const cartItems = document.querySelectorAll("#cartList li");
            let totalProducts = 0;

            cartItems.forEach((item) => {
                totalProducts += Number(item.dataset.quantity);
            });

            document.getElementById("productCount").textContent =
                "Total products in the cart: " + totalProducts;
        });
    </script>
</body>
</html>
